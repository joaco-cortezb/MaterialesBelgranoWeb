<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Materiales Belgrano">
  <!--
    Isologo de Materiales Belgrano: tres losas en perspectiva vistas desde
    abajo (frente verde #7CB928 que sube hacia la derecha; cara lateral gris
    #393C35, más angosta cuanto más arriba), tomado del logo oficial.
    Dibujado a mano en SVG para que sea nítido a cualquier tamaño.
  -->
  <g transform="translate(-39 0)">
    <!-- losa superior -->
    <polygon fill="#393c35" points="120,208 180,180 180,212 120,226"/>
    <polygon fill="#7cb928" points="180,180 470,110 470,142 180,212"/>
    <!-- losa media -->
    <polygon fill="#393c35" points="120,288 180,260 180,292 120,314"/>
    <polygon fill="#7cb928" points="180,260 470,190 470,222 180,292"/>
    <!-- losa inferior -->
    <polygon fill="#393c35" points="120,368 180,340 180,372 120,402"/>
    <polygon fill="#7cb928" points="180,340 470,270 470,302 180,372"/>
  </g>
</svg>
